services:
  # Production-like build served by nginx: `docker compose up app`
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    restart: unless-stopped

  # Live-reloading dev server: `docker compose --profile dev up dev`
  dev:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    profiles: ["dev"]

volumes:
  node_modules:
